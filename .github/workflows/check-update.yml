name: Check and Update @neoxr Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: 5.0-ESM
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Check for Package Updates
        id: check-update
        run: |
          WB_VER=$(npm view @neoxr/wb version)
          STORE_VER=$(npm view @neoxr/store version)
          echo "Latest @neoxr/wb on NPM: $WB_VER"
          echo "Latest @neoxr/store on NPM: $STORE_VER"

          yarn add @neoxr/wb@latest @neoxr/store@latest

          if git diff --quiet package.json; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"

            # Deteksi package mana saja yang mengalami update
            CHANGES=()
            BRANCH_PARTS=()

            if git diff package.json | grep -q '"@neoxr/wb"'; then
              CHANGES+=("@neoxr/wb to v${WB_VER}")
              BRANCH_PARTS+=("wb-v${WB_VER}")
            fi

            if git diff package.json | grep -q '"@neoxr/store"'; then
              CHANGES+=("@neoxr/store to v${STORE_VER}")
              BRANCH_PARTS+=("store-v${STORE_VER}")
            fi

            SUMMARY=$(IFS=", "; echo "${CHANGES[*]}")
            BRANCH_NAME="bump-$(IFS="-"; echo "${BRANCH_PARTS[*]}")"

            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Branch, PR and Merge
        if: steps.check-update.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH_NAME: ${{ steps.check-update.outputs.branch_name }}
          SUMMARY: ${{ steps.check-update.outputs.summary }}
        run: |
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, skipping..."
            exit 0
          fi

          git config user.name "neoxr-triage[bot]"
          git config user.email "neoxr-triage[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -f package.json yarn.lock
          git commit -m "chore(deps): update ${SUMMARY}"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "chore(deps): bump ${SUMMARY}" \
            --body "Automated dependency update for: ${SUMMARY}." \
            --head "$BRANCH_NAME" \
            --base 5.0-ESM)

          gh pr merge "$PR_URL" --squash --delete-branch --admin
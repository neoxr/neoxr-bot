name: Auto Approve and Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  repository-projects: read

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'neoxr' ||
      github.actor == 'dependabot[bot]' ||
      github.actor == 'neoxr-triage[bot]'
    
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1.11.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update PR Title and Body
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} | head -c 5000)
          
          if [ -n "$DIFF" ]; then
            RESPONSE=$(curl -s -X POST "https://secure-signed.pages.dev/api/ai/revisi" \
              -H "x-apikey: ${{ secrets.NEOXR_API_KEY }}" \
              --data-urlencode "prompt=$DIFF")
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status // false')
            
            if [ "$STATUS" != "true" ]; then
              sleep 2
              RESPONSE=$(curl -s -X POST "https://secure-signed.pages.dev/api/ai/revisi" \
                -H "x-apikey: ${{ secrets.NEOXR_API_KEY }}" \
                --data-urlencode "prompt=$DIFF")
            fi
            
            CONTENT=$(echo "$RESPONSE" | jq -r '.data.message')
            
            if [ -n "$CONTENT" ] && [ "$CONTENT" != "null" ]; then
              TITLE=$(echo "$CONTENT" | head -n 1)
              
              echo "$CONTENT" | tail -n +3 > pr_body.txt
              
              if [ ! -s pr_body.txt ]; then
                 echo "$CONTENT" | tail -n +2 > pr_body.txt
              fi

              gh pr edit ${{ github.event.pull_request.number }} --title "$TITLE" --body-file pr_body.txt
            fi
          fi

      - name: AI Code Review
        id: ai-review
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} | head -c 5000)
          
          if [ -z "$DIFF" ]; then
            MESSAGE="✅ Approved automatically (No code changes detected)."
          else
            RESPONSE=$(curl -s -X POST "https://secure-signed.pages.dev/api/ai/review" \
              -H "x-apikey: ${{ secrets.NEOXR_API_KEY }}" \
              --data-urlencode "prompt=$DIFF")
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status // false')
            
            if [ "$STATUS" != "true" ]; then
              sleep 2
              RESPONSE=$(curl -s -X POST "https://secure-signed.pages.dev/api/ai/review" \
                -H "x-apikey: ${{ secrets.NEOXR_API_KEY }}" \
                --data-urlencode "prompt=$DIFF")
            fi
            
            MESSAGE=$(echo "$RESPONSE" | jq -r '.data.message // "✅ Approved automatically"')
          fi
          
          {
            echo "AI_COMMENT<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          COMMENT_BODY: ${{ env.AI_COMMENT }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve -b "$COMMENT_BODY"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch